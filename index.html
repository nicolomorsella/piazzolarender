#hd p{margin:1px 0 6px;font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
button{font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid rgba(53,104,70,.7);background:rgba(255,255,255,.55);color:var(--fg);cursor:pointer;font-weight:600;transition:background .18s ease,transform .18s ease,box-shadow .18s ease}
button:hover{background:rgba(255,255,255,.9);box-shadow:0 2px 7px rgba(30,60,40,.16);transform:translateY(-1px)}
button:focus-visible{outline:2px solid #d28b3c;outline-offset:2px}
button.on{background:var(--line);color:#f5f8f3;box-shadow:0 2px 7px rgba(30,70,40,.22)}

.pin{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:26px;box-sizing:border-box;border-radius:13px;background:var(--line);color:var(--bg);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 6px;pointer-events:none;border:2px solid var(--bg);z-index:1}
.pin.s{min-width:22px;height:20px;border-radius:10px;font-size:10px;padding:0 4px}
.dm{position:absolute;transform:translate(-50%,0);margin-top:17px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;color:var(--fg);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);z-index:1}
#sc{position:absolute;left:12px;bottom:14px;background:var(--panel);padding:4px 8px;border-radius:8px;font-size:12px;display:none;z-index:2}
#sc i{display:block;height:5px;border:2px solid var(--fg);border-top:0;margin-bottom:2px}

details#lg[open]{max-height:55vh}
summary{cursor:pointer;font-weight:700;padding:8px 12px;background:var(--panel);border-radius:9px;position:sticky;top:0;z-index:21;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(128,128,128,.2);-webkit-user-select:none;user-select:none}

.fm{margin:2px 0 6px;font-size:11px;opacity:.8}

table.lg .ms{white-space:nowrap;font-weight:600;text-align:right;font-size:11px}
table.lg .nt{font-size:11px;opacity:.8;display:block;margin-top:1px}
table.lg .gr td{background:rgba(47,93,58,.15);font-weight:700;border-top:1.5px solid var(--line);font-size:11px;padding:3px 4px}
#nt{margin:6px 0 2px;font-size:11px;opacity:.85;line-height:1.3}
